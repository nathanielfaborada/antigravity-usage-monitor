name: Publish Extension

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  publish:
    name: Package & Publish to VS Code Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests (Headless via Xvfb)
        run: xvfb-run -a npm test

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set in GitHub repository secrets! Please add VSCE_PAT to enable automatic marketplace deployment."
            exit 1
          fi
          npx @vscode/vsce publish --no-git-tag-version -p "$VSCE_PAT"

      - name: Package VSIX Artifact
        if: always()
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Upload VSIX Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
